[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolbox"
version = "0.1.0"
description = "Aggregate tools from multiple MCP servers into a unified registry with LLM-callable meta-tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/prashanthm277/mcp-toolbox"
Issues = "https://github.com/prashanthm277/mcp-toolbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
